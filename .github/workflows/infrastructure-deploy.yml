name: Terraform Infrastructure Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.3"

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Lint, Validate, Security Scan, Plan
  # Runs on all pushes and PRs to main
  # ─────────────────────────────────────────────────────────────
  terraform-plan:
    name: Terraform Plan & Security Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      TF_VAR_mongo_uri: ${{ secrets.MONGO_URI }}
      TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Run tfsec Security Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          minimum_severity: HIGH
          soft_fail: true   # Non-blocking in dev — harden to false in prod

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan
          retention-days: 1   # Plan is only valid for the current apply run

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Apply
  # Only runs on direct push to main (not PRs)
  # Requires the plan artifact from Job 1
  # ─────────────────────────────────────────────────────────────
  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production   # Enables manual approval gate in GitHub env settings

    defaults:
      run:
        working-directory: terraform

    env:
      TF_VAR_mongo_uri: ${{ secrets.MONGO_URI }}
      TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform/   # Downloads tfplan into the terraform/ directory

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false tfplan
